services:
  - type: web
    name: 1arley-cms-backend
    runtime: node
    rootDir: services/cms-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 1arley-db
          property: connectionString
      - key: CMS_ADMIN_EMAIL
        sync: false
      - key: CMS_ADMIN_PASSWORD
        sync: false
      - key: CMS_SECRET
        generateValue: true

databases:
  - name: 1arley-db
    plan: free
