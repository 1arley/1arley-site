name: cd-workflow

on:
    push:
        branches:
            - main
            - dev

env:
    IMAGE_NAME: your-registry.com/your-org/1arley-template
    CACHE_SCOPE: 1arley-template-docker

jobs:
    install-dependencies:
        name: "Setup and Install Dependencies"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

    docker-build:
        name: "Build Docker Image"
        needs: install-dependencies
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Set image tag
              id: tag
              run: |
                  if [ "${{ github.ref_name }}" = "main" ]; then
                    echo "value=latest" >> $GITHUB_OUTPUT
                  else
                    echo "value=dev" >> $GITHUB_OUTPUT
                  fi

            - name: Build Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  tags: |
                      ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  outputs: type=docker,dest=${{ runner.temp }}/1arley-template.tar
                  cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
                  cache-to: type=gha,scope=${{ env.CACHE_SCOPE }},mode=max

            - name: Upload Docker Image Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: 1arley-template-image
                  path: ${{ runner.temp }}/1arley-template.tar
                  if-no-files-found: error
                  retention-days: 1

    registry-push:
        name: "Push Docker Image to Registry"
        needs: docker-build
        runs-on: ubuntu-latest
        steps:
            - name: Resolve image tag
              id: tag
              run: |
                  if [ "${{ github.ref_name }}" = "main" ]; then
                    echo "value=latest" >> $GITHUB_OUTPUT
                  else
                    echo "value=dev" >> $GITHUB_OUTPUT
                  fi

            - name: Download Docker Image Artifact
              uses: actions/download-artifact@v4
              with:
                  name: 1arley-template-image
                  path: ${{ runner.temp }}

            - name: Log in to registry
              uses: docker/login-action@v3
              with:
                  registry: your-registry.com
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}

            - name: Load Docker Image
              run: docker load --input "$RUNNER_TEMP/1arley-template.tar"

            - name: Push Docker Image
              run: |
                  docker push ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
                  docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
