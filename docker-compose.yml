name: 1arley-template

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: 1arley-template-dev
        restart: unless-stopped
        ports:
            - "8080:8080"
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - API_BASE_URL=${API_BASE_URL}
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
